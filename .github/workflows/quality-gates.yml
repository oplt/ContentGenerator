name: quality-gates

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: content_generator
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUBLIC_URL: http://localhost:8000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/content_generator
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      LLM_PROVIDER: mock
      EMBEDDINGS_PROVIDER: hashing
      SOCIAL_DRY_RUN_BY_DEFAULT: "true"
      MULTI_ACCOUNT_ROLLOUT_MODE: on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Mypy
        run: .venv/bin/mypy .
      - name: Pytest unit (exclude integration)
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/pytest -q -m "not integration"
      - name: Alembic upgrade head (disposable Postgres)
        run: |
          export DB_POOL_USE_NULL=true
          export CG_RUN_DB_MIGRATIONS=1
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/pytest -q -m integration tests/test_migration_drift.py
      - name: Benchmark baselines
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/pytest -q tests/benchmarks

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Domain E2E (chromium + mobile)
        run: npx playwright test --project=chromium --project=mobile-chrome
        env:
          CI: "true"

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime/report artifacts
        run: |
          set -euo pipefail
          patterns=(
            '^dump\.rdb$'
            '\.rdb$'
            '^frontend/playwright-report/'
            '^frontend/test-results/'
            '^frontend/blob-report/'
            '\.tsbuildinfo$'
          )
          tracked="$(git ls-files)"
          failed=0
          for pattern in "${patterns[@]}"; do
            matches="$(printf '%s\n' "$tracked" | grep -E "$pattern" || true)"
            if [[ -n "$matches" ]]; then
              echo "::error::Tracked runtime/report artifact(s) matched /$pattern/:"
              printf '%s\n' "$matches"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Remove these files from git and keep them ignored (see .gitignore)."
            exit 1
          fi
          echo "No forbidden runtime/report artifacts are tracked."
      - name: Rollout gates doc present
        run: test -f docs/rollout/gates.md
